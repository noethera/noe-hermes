# One Dark for the Hermes terminal (TUI/CLI). Palette ported from brunordgs/warp-one-dark (MIT);
# reasoning gray #5c6370 is One Dark's standard comment color. The desktop keeps its own pick (Appearance).
name: one-dark
description: One Dark — Atom palette, blue accent, purple tool calls
colors:
  background: "#282c34"
  ui_accent: "#61afef"
  banner_accent: "#61afef"
  ui_tool: "#c678dd"
  ui_thinking: "#5c6370"
  banner_title: "#e6e6e6"
  ui_primary: "#d7dae0"
  banner_text: "#abb2bf"
  ui_text: "#abb2bf"
  ui_label: "#abb2bf"
  banner_dim: "#7f848e"
  banner_border: "#3f4451"
  ui_border: "#3f4451"
  ui_ok: "#98c379"
  ui_warn: "#d19a66"
  ui_error: "#e06c75"
  prompt: "#61afef"
  input_rule: "#3f4451"
  response_border: "#61afef"
  status_bar_bg: "#21252b"
  status_bar_text: "#abb2bf"
  status_bar_strong: "#d7dae0"
  status_bar_dim: "#7f848e"
  status_bar_good: "#98c379"
  status_bar_warn: "#d19a66"
  status_bar_bad: "#e06c75"
  status_bar_critical: "#ff616e"
  session_label: "#56b6c2"
  session_border: "#3f4451"
  completion_menu_bg: "#21252b"
  completion_menu_current_bg: "#3e4451"
  selection_bg: "#3e4451"
  shell_dollar: "#98c379"
  voice_status_bg: "#21252b"
  syntax_string: "#98c379"
  syntax_number: "#d19a66"
  syntax_keyword: "#c678dd"
  syntax_comment: "#5c6370"
  # Diff lines like GitHub/Claude Code: a soft tinted line background, normal light text on top.
  # diff_added/removed = line background; *_word = text color on that line.
  diff_added: "#2b3d31"
  diff_added_word: "#d7dae0"
  diff_removed: "#452c32"
  diff_removed_word: "#d7dae0"
branding:
  help_header: "[?] Available Commands"
tool_prefix: "┊"
